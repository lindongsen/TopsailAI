topsailai:
  version: '1.0'
  python_version: '3.13'
  src:
    include:
      - topsailai/
    exclude:
      - topsailai_server
      - topsailai_data
    lib_home: '/TopsailAI/src'
  non-src:
    'pyproject.toml': '/TopsailAI/pyproject.toml'
    'uv.lock': '/TopsailAI/uv.lock'
  control:
    template: 'build/data/template/control'
    params:
      depends: ''
  prerm:
    template: 'build/data/template/prerm'
    params:
      lib_home: '/TopsailAI/src'

topsailai-data:
  version: '1.0'
  non-src:
    'src/topsailai_data/bin/topsailai_data': '/usr/local/bin/topsailai_data'
    'src/topsailai_data/skills': '/TopsailAI/src/topsailai_data/skills'
  control:
    template: 'build/data/template/control'
    params:
      depends: ''
