# Project Options for AI
# Follows the common project structure convention: the workspace is the project
# folder itself, so source code lives directly under this directory.

workspace: "/TopsailAI/src/topsailai_connector"
ProjectFolder: "/TopsailAI/src/topsailai_connector"
ProjectRootFolder: "/TopsailAI"
ProjectCode: "connector"
name: "TopsailAI Connector"
description: >-
  Remote access system for files and commands with an explicit permission
  boundary. A Node on a personal computer dials out to a Server in the cloud and
  serves only the operations its local policy allows; the Server never dials the
  Node, so no inbound port or public address is required.
programming_language: go

docs: # Collaborative documents between components; keep them updated and aligned.
  - docs/permission-design.md
  - docs/API.md
  - docs/Environment_Variables.md

references:
  - docs/permission-design.md
  - docs/API.md

workspace_project_structure: |
  - cmd/ # Executable entry points, one package main per binary
    - connector-server/ # Cloud side
    - connector-node/ # Personal computer side

  - internal/ # Private packages; the compiler blocks cross-module imports
    - protocol/ # Shared wire contract: frame types, operations, request/response
    - security/ # Shared vocabulary: scopes, permissions, secret comparison
    - server/ # Cloud implementation
    - node/ # Personal computer implementation

  - docs/ # DocsFolder, Store documents
    - permission-design.md # Three-secret contract, node-id.node-token pair, path fence, policy file
    - API.md # CLI HTTP API: endpoint, headers, error codes, routing
    - Environment_Variables.md # Comprehensive reference for all environment variables used
    - cases/ # Store various test/use cases, read all files here when planning tests
      - UserCase_xxx.md
      - TestCase_xxx.md
      - AdversarialCase_xxx.md

  - features/ # FeaturesFolder, Store various factual feature information
    - feature-xxx.md

  - issues/ # IssuesFolder, Store various issue files, Put the processing results of the issue into the corresponding subfolders
    - done/ # the issues have fixed
    - undo/ # the issues can be ignored
    - issue-xxx.md

  - tests/ # TestsFolder, Store testing code files
    - unit/ # Go unit tests live beside the source as *_test.go; this folder holds cross-package helpers
    - integration/ # (integration test) or (live integration test)
    - bdd/ # Behavior Driven Development (Gherkin) tests for user-visible behavior
    - e2e/ # Complete or auxiliary scripts for E2E

  - skills/ # Operator and user facing skills, one folder per audience
    - connector-client/ # For the person calling a Node: the cli command, flags, error codes
    - connector-server-operations/ # For the Server operator: deploy, configure, rotate, troubleshoot
    - connector-node-setup/ # For the person running a Node: identity, policy file, start, regenerate

  - ".task/" # The last/current task info, The Folder's maintainer is AI
    - plan_xxx.md
    - code_xxx.md
    - test_xxx.md
    - check_xxx.md

  - ".topsailai/" # Agent launcher configuration
    - settings.yaml # Driver, injected context sources, environment variables

  - bin/ # Build output, git-ignored
  - .tmp/ # Temporary artifacts, git-ignored

Notes: |
  - All code modifications must be recorded in issues (exclude test code).
  - Go unit tests are placed in the same package as the source code, as *_test.go.
  - The Server must never store a Node token: no persistence, no logging, no
    retention after forwarding, no derived values such as hashes or fingerprints.
    See docs/permission-design.md.
  - Three secrets, three gates: `tunnel_token` and `client_token` are Server
    environment variables validated by the Server; `node-id.node-token` is
    generated by the Node and validated by the Node. No secret carries a
    permission; the policy file is the only source of authorization.
  - The Node is the only authority for permissions: it controls both the access
    scope (`scope`) and the concrete action allowed there (`permission`). The
    Server holds no scope list and no permission list, and the CLI's choice of
    scope and operation is a request, not a grant. Default deny when no policy
    matches.
  - Build artifacts go to bin/ and temporary files go to .tmp/; both are ignored.
  - If environment variables are added or changed, update docs/Environment_Variables.md.
  - If the wire contract or the permission model changes, update docs/permission-design.md.
  - If the CLI HTTP API changes, update docs/API.md.
  - If a test case is added or changed, update docs/cases/.
  - Windows is a supported platform. A path rule that only holds on POSIX is a
    defect, not a limitation.
