# Mock Provider workspace

This workspace is the test-only Provider CLI. It implements the Adapter CLI protocol as a conforming
reference and as a locally configured fault injector. It is never packaged and never deployed.

The module path is `agent-cluster-provider-mock`, declared in `go.mod` at this workspace root. The
package `main` and its unit tests live in `src/`.
